name: Build
on:
  workflow_dispatch:
    @@INPUTS@@
jobs:
  build:
    runs-on: ubuntu-latest
    @@PERMISSIONS@@
    env:
      AF_VERSION_NAME: "@@VERSION_NAME@@"
      AF_VERSION_CODE: "@@VERSION_CODE@@"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      @@ANDROID_PREP@@
      - name: Build @@VARIANT@@
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew @@GRADLE_TASK@@ --no-daemon; else gradle @@GRADLE_TASK@@ --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "@@ARTIFACT_PATH@@"
          retention-days: 1
      @@RELEASE@@
