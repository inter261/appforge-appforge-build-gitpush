name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AF_VERSION_NAME: ""
      AF_VERSION_CODE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Pakai debug keystore tetap
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Gradle init script (signing dan versi)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/appforge.gradle <<'APPFORGE_EOF'
          // Dibuat oleh AppForge: menerapkan signing dan versi tanpa mengubah build script proyek.
          allprojects {
              afterEvaluate { p ->
                  if (!p.plugins.hasPlugin("com.android.application")) return
                  def ext = p.extensions.getByName("android")

                  def ksFile = System.getenv("AF_KS_FILE")
                  if (ksFile) {
                      def cfg = ext.signingConfigs.findByName("appforge")
                      if (cfg == null) cfg = ext.signingConfigs.create("appforge")
                      cfg.storeFile = new File(ksFile)
                      cfg.storePassword = System.getenv("AF_KS_PASS")
                      cfg.keyAlias = System.getenv("AF_KS_ALIAS")
                      cfg.keyPassword = System.getenv("AF_KEY_PASS")
                      def custom = System.getenv("AF_KS_CUSTOM") == "1"
                      ext.buildTypes.each { bt ->
                          if (custom || (bt.name == "release" && bt.signingConfig == null)) bt.signingConfig = cfg
                      }
                  }

                  def vc = System.getenv("AF_VERSION_CODE")
                  def vn = System.getenv("AF_VERSION_NAME")
                  def comps = p.extensions.findByName("androidComponents")
                  if ((vc || vn) && comps != null) {
                      comps.onVariants(comps.selector().all(), { variant ->
                          variant.outputs.each { o ->
                              if (vc) o.versionCode.set(vc.toInteger())
                              if (vn) o.versionName.set(vn)
                          }
                      })
                  }
              }
          }
          APPFORGE_EOF
      - name: Signing bawaan (debug key tetap)
        run: |
          {
            echo "AF_KS_FILE=$HOME/.android/debug.keystore"
            echo "AF_KS_PASS=android"
            echo "AF_KS_ALIAS=androiddebugkey"
            echo "AF_KEY_PASS=android"
          } >> "$GITHUB_ENV"
      - name: Build debug
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 1
      - name: Rilis di GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          MODE="new"
          TAG="tet"
          mapfile -t FILES < <(find . -path '*/build/outputs/apk/debug/*.apk' -type f)
          if [ "${#FILES[@]}" -eq 0 ]; then echo "Tidak ada file untuk dirilis"; exit 1; fi
          if [ "$MODE" = "new" ]; then
            if [ -z "$TAG" ]; then TAG="build-${GITHUB_RUN_NUMBER}"; fi
            if gh release view "$TAG" >/dev/null 2>&1; then TAG="${TAG}-${GITHUB_RUN_NUMBER}"; fi
          fi
          if [ -z "$TAG" ]; then TAG="build-${GITHUB_RUN_NUMBER}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Memperbarui rilis $TAG"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Membuat rilis $TAG"
            gh release create "$TAG" "${FILES[@]}" --title "$TAG" --notes "Dibuat oleh AppForge" --target "$GITHUB_SHA"
          fi
          echo "Rilis: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
