name: Build AppForge
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # Release (R8) = APK untuk dipakai sehari-hari; debug disimpan sebagai cadangan kalau release bermasalah.
      - run: gradle assembleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: "**/build/outputs/apk/release/*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: "**/build/outputs/apk/debug/*.apk"
